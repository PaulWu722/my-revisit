<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6e9">
<title>我的回訪</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
:root{
  --bg:#fbf3e4; --card:#fffaf1; --ink:#5a3e2b; --muted:#9a7f68; --line:#f0e2c8;
  --green:#5aa469; --green-d:#478a55; --red:#e8564a; --orange:#f39c3d; --yellow:#f2c230;
  --lv0:#9aa0a6; --lv1:#5b9bd5; --lv2:#5cb85c; --lv3:#f2c230; --lv4:#f5a623;
  --r:22px; --shadow:0 6px 18px rgba(140,95,50,.13);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img.ic{width:1.35em;height:1.35em;object-fit:contain;vertical-align:-.3em;flex:none}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);box-shadow:var(--shadow);z-index:5}
.logo{display:flex;align-items:center;gap:6px;font-size:26px;font-weight:900;white-space:nowrap;letter-spacing:2px;padding-right:14px;border-right:2px solid var(--line)}
.logo img{width:40px;height:40px;object-fit:contain}
.tabs{display:flex;gap:6px}
.tabs button{display:flex;align-items:center;gap:6px;border:0;background:none;border-radius:999px;padding:8px 18px;font-weight:800;font-size:17px;color:var(--ink)}
.tabs button.on{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 16px}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent}
.btn{border:0;border-radius:999px;padding:8px 16px;font-weight:800;background:#f3e7d3;color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
.btn.danger{background:#fbe3df;color:#c0392b}
.btn.small{padding:5px 12px;font-size:13px;box-shadow:none}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none;min-width:160px;z-index:20}
.menu.open .menu-list{display:block}
.menu-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:10px}
.menu-list button:hover{background:#f3e7d3}

/* main grid */
.main{display:grid;grid-template-columns:1fr 400px;gap:16px;padding:16px;min-height:0}
.left{display:flex;flex-direction:column;gap:16px;min-height:0;min-width:0}
.view{display:none;flex-direction:column;gap:16px;min-height:0;flex:1}
.main[data-tab="overview"] .view-overview,.main[data-tab="list"] .view-list,.main[data-tab="stats"] .view-stats{display:flex}
.view-list,.view-stats{overflow:auto}
.stage{position:relative;flex:1;border-radius:var(--r);overflow:hidden;background:#7fd3e0;box-shadow:var(--shadow);min-height:300px}
#scene{position:absolute;inset:0}
.scene-fallback{pointer-events:none;position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#2c6e7f;font-weight:700}
.scene-fallback[hidden]{display:none}
.time-btn,.filter-btn{position:absolute;z-index:3;background:rgba(255,250,240,.93);border:0;border-radius:999px;padding:7px 14px;font-weight:800;box-shadow:var(--shadow)}
.time-btn{left:12px;bottom:12px}
.filter-btn{left:12px;top:12px}
.filter-btn.active{background:var(--green);color:#fff}
.filter-pop{position:absolute;left:12px;top:54px;z-index:4;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:none;gap:8px;flex-direction:column;width:220px}
.filter-pop.open{display:flex}
.filters select,.filter-pop select{width:100%;border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:#fff}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.card h3{margin:0 0 10px;font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px}

/* bottom row */
.bottom{display:grid;grid-template-columns:minmax(340px,1fr) 2fr;gap:16px}
.week-card{display:flex;align-items:center;gap:12px}
.week-card .ic{width:44px;height:44px}
.week-card .t{font-size:21px;font-weight:900;white-space:nowrap}
.big-num{font-size:46px;font-weight:900;color:var(--red);line-height:1;margin:0 4px}
.week-avs{display:flex;margin-left:auto;padding-left:18px}
.week-avs span{position:relative;margin-left:-10px}
.week-avs .av{width:46px;height:46px;border:3px solid #fff}
.week-avs span::after{content:"✓";position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}
.dist{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.dist .col{min-width:0}
.dist .hd{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;white-space:nowrap}
.dist .hd img{width:26px;height:26px}
.dist .n{font-size:13px;color:var(--muted);margin:2px 0 4px 32px;white-space:nowrap}
.bar{height:9px;border-radius:9px;background:#f0e5d2;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}

/* side */
.side{display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0;padding-bottom:4px}
.urgent-item{display:flex;align-items:center;gap:12px;padding:9px 6px;border-top:1px dashed var(--line);cursor:pointer;border-radius:12px}
.urgent-item:first-of-type{border-top:0}
.urgent-item:hover,.urgent-item.sel{background:#f8eedd}
.urgent-item .who{flex:1;min-width:0}
.urgent-item .who b{display:block;font-size:16px}
.urgent-item .who small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urgent-item .st{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.urgent-item .st.late{color:var(--red)}
.days{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:900;font-size:13px;color:#fff;white-space:nowrap}
.d-ok{background:var(--green)} .d-warn{background:var(--yellow);color:#6b4d00} .d-bad{background:var(--orange)} .d-gone{background:var(--red)}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#f3e7d3;display:grid;place-items:center;font-weight:800}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.more{display:block;width:100%;border:0;background:none;color:var(--green-d);font-weight:800;padding:6px 0 0}

/* detail (side panel + dialog share this) */
.detail-card{padding:18px}
.detail-card:empty{display:none}
.d-head{display:flex;gap:16px;align-items:center;position:relative}
.d-head .av{width:120px;height:120px;border-radius:24px;border:4px solid #fff;box-shadow:var(--shadow);font-size:40px}
.d-head h2{margin:0 0 4px;font-size:28px;font-weight:900;letter-spacing:1px}
.d-tools{position:absolute;right:0;top:0;display:flex;gap:6px}
.kv{margin:2px 0;font-size:15px;display:flex;align-items:center;gap:6px}
.kv .k{color:var(--muted)}
.gems img{width:22px;height:22px;vertical-align:-5px}
.sec{margin-top:16px;padding-top:12px;border-top:2px dashed var(--line)}
.sec h4{margin:0 0 8px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px}
.sec h4 .btn{margin-left:auto}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid #cfe7cf}
.timeline li{position:relative;padding:0 0 9px 10px;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid #fff}
.timeline .date{font-weight:800;margin-right:8px}
.timeline .x-log{float:right;border:0;background:none;color:var(--muted);padding:0 4px}
.tag{display:inline-block;background:#e9f4e6;color:#3d7a4a;border-radius:999px;padding:0 8px;font-size:12px;margin:2px 3px 0 0}
.boxes{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin-top:14px}
.box{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-size:14px}
.box h5{margin:0 0 6px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px}
.countdown{font-size:16px;font-weight:800;text-align:center}
.countdown b{font-size:34px;color:var(--red);margin:0 4px}
.box ul{margin:0;padding-left:16px}
.chat-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.chat-btns a{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:18px;color:#fff;font-weight:900;font-size:17px;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.chat-btns a img{width:30px;height:30px}
.chat-btns a.off{opacity:.4;pointer-events:none}
.line{background:linear-gradient(#3ccf6b,#22b357)} .ig{background:linear-gradient(90deg,#fb9a5b,#ef5a8f,#b05ad6)}
.contact-toggle{width:100%;margin-top:14px;padding:11px;font-size:16px}

/* list view */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select,.toolbar.filters select{width:auto;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff}
.toolbar .count{margin-left:auto;color:var(--muted);font-weight:700}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:3px solid transparent}
.pcard:hover,.pcard.sel{border-color:#cfe7cf}
.pcard .av{width:64px;height:64px;border-radius:18px}
.pcard .info{flex:1;min-width:0}
.pcard b{font-size:17px}
.pcard small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .row{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.isle{font-size:12px;font-weight:800;border-radius:999px;padding:0 8px;background:#e8f4fb;color:#2f7aa0}
.isle.done{background:#e9f4e6;color:#3d7a4a}

/* stats view */
.stat-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px}
.tile .v{font-size:36px;font-weight:900;line-height:1.1}
.tile .l{color:var(--muted);font-weight:700}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:7px 6px;text-align:left;border-bottom:1px dashed var(--line)}
table.t th{color:var(--muted);font-weight:700}
.recent li{margin-bottom:6px}

/* dialogs */
dialog{border:0;padding:0;border-radius:26px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(80,50,20,.35);width:min(560px,94vw);max-height:92dvh}
dialog::backdrop{background:rgba(70,45,25,.35);backdrop-filter:blur(2px)}
.dlg{display:flex;flex-direction:column;max-height:92dvh}
.dlg-head{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:19px;flex:1}
.x{border:0;background:#f3e7d3;width:34px;height:34px;border-radius:50%;font-size:18px}
.dlg-body{overflow:auto;padding:16px 18px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
form input,form select,form textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;outline:0}
form input:focus,form select:focus,form textarea:focus{border-color:var(--green)}
form textarea{min-height:70px;resize:vertical}
.photo-pick{display:flex;align-items:center;gap:12px}
.photo-pick .av{width:64px;height:64px}
.hint{font-size:12px;color:var(--muted)}
.sprite-pick{display:flex;align-items:center;gap:10px}.sprite-pick select{flex:1}.sprite-pick img{height:64px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;transition:transform .3s;z-index:100;font-weight:700}
.toast.show{transform:translateX(-50%) translateY(0)}

/* medium: detail moves into a dialog */
@media (max-width:1180px){
  .main{grid-template-columns:1fr 330px}
  #detailPanel{display:none}
  .dist{grid-template-columns:repeat(3,1fr)}
  .stat-tiles{grid-template-columns:repeat(2,1fr)}
}
/* phone */
@media (max-width:820px){
  .top{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .logo{font-size:20px;border:0;padding:0}
  .logo img{width:30px;height:30px}
  .tabs{order:4;flex-basis:100%;justify-content:space-around}
  .tabs button{font-size:15px;padding:6px 14px}
  .search{order:3;flex-basis:100%}
  .top .btn.primary .t{display:none}
  .top .btn.primary{margin-left:auto}
  .app{height:auto;min-height:100dvh}
  .main{grid-template-columns:1fr;padding:10px;gap:12px}
  .stage{flex:none;height:auto;min-height:0;aspect-ratio:3/2}
  .time-btn,.filter-btn{padding:4px 10px;font-size:12px}
  .time-btn{left:8px;bottom:8px}.filter-btn{left:8px;top:8px}
  .filter-pop{left:8px;top:40px}
  .bottom{grid-template-columns:1fr}
  .dist{grid-template-columns:repeat(2,1fr)}
  .stats-grid{grid-template-columns:1fr}
  .side{overflow:visible}
  dialog{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;border-radius:0;margin:0}
  .dlg{max-height:100dvh;height:100dvh}
  .dlg-body{flex:1}
  .d-head .av{width:88px;height:88px}
  .boxes{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><img src="icons/logo.webp" alt="">我的回訪</div>
    <nav class="tabs">
      <button data-tab="overview" class="on"><img class="ic" src="icons/school.webp" alt="">總覽</button>
      <button data-tab="list"><img class="ic" src="icons/chat.webp" alt="">名單</button>
      <button data-tab="stats"><img class="ic" src="icons/calendar.webp" alt="">統計</button>
    </nav>
    <label class="search">🔍<input id="q" type="search" placeholder="搜尋姓名、學校或科系…"></label>
    <button class="btn primary" id="addBtn">＋<span class="t"> 新增名單</span></button>
    <div class="menu" id="menu">
      <button class="btn" id="menuBtn" aria-label="更多">⋯</button>
      <div class="menu-list">
        <button id="exportBtn">⬇️ 匯出備份 JSON</button>
        <button id="importBtn">⬆️ 匯入備份 JSON</button>
        <button id="resetDemoBtn">🔄 重新載入範例</button>
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </header>

  <main class="main" data-tab="overview">
    <section class="left">
      <div class="view view-overview">
        <section class="stage">
          <div id="scene"></div>
          <div class="scene-fallback" id="sceneFallback">島嶼載入中…</div>
          <button class="filter-btn" id="filterBtn">🧭 篩選</button>
          <div class="filter-pop filters" id="filterPop">
            <select class="f-school"></select><select class="f-dept"></select><select class="f-lv"></select>
            <button class="btn small" data-clearfilter>清除篩選</button>
          </div>
          <button class="time-btn" id="timeBtn">🕐 自動</button>
        </section>
        <div class="bottom">
          <div class="card week-card"><img class="ic" src="icons/calendar.webp" alt=""><span class="t">本週已聯繫</span><span class="big-num" id="statWeek">0</span><span class="t">人</span><div class="week-avs" id="weekAvs"></div></div>
          <div class="card"><h3><img class="ic" src="icons/lv4.webp" alt="">敞開程度分佈 <small id="statTotal" style="font-weight:600;color:var(--muted)"></small></h3><div class="dist" id="statDist"></div></div>
        </div>
      </div>

      <div class="view view-list">
        <div class="toolbar filters">
          <select class="f-school"></select><select class="f-dept"></select><select class="f-lv"></select>
          <select id="sortBy"><option value="days">依未聯繫天數</option><option value="lv">依敞開程度</option><option value="name">依名字</option></select>
          <span class="count" id="listCount"></span>
        </div>
        <div class="people-grid" id="peopleGrid"></div>
      </div>

      <div class="view view-stats" id="statsView"></div>
    </section>

    <aside class="side">
      <div class="card">
        <h3><img class="ic" src="icons/bell.webp" alt="">快快聯繫</h3>
        <div id="urgent"></div>
      </div>
      <div class="card detail-card" id="detailPanel"></div>
    </aside>
  </main>
</div>

<dialog id="detailDlg"><div class="dlg" id="detail"></div></dialog>

<dialog id="editDlg">
  <form class="dlg" id="editForm" method="dialog">
    <div class="dlg-head"><h2 id="editTitle">新增名單</h2><button type="button" class="x" data-close>✕</button></div>
    <div class="dlg-body">
      <div class="photo-pick">
        <div class="av" id="photoPreview">?</div>
        <div>
          <button type="button" class="btn small" id="photoBtn">選擇大頭照</button>
          <button type="button" class="btn small" id="photoClear">移除</button>
          <input type="file" id="photoFile" accept="image/*" hidden>
        </div>
      </div>
      <div class="grid2">
        <div><label>名字 *</label><input name="name" required maxlength="20"></div>
        <div><label>年級</label><input name="grade" placeholder="大一、碩一…"></div>
        <div><label>學校</label>
          <select name="school"><option>中興大學</option><option>亞洲大學</option><option>朝陽科技大學</option><option>其他</option></select></div>
        <div><label>科系</label><input name="dept" list="deptList"></div>
      </div>
      <datalist id="deptList"></datalist>
      <label>島上的角色造型</label>
      <div class="sprite-pick"><select name="sprite"><option value="1">造型 1</option><option value="2">造型 2</option><option value="3">造型 3</option><option value="4">造型 4</option><option value="5">造型 5</option><option value="6">造型 6</option><option value="7">造型 7</option><option value="8">造型 8</option></select><img id="spritePreview" alt=""></div>
      <label>怎麼認識的</label><input name="howMet" placeholder="例如：迎新活動、宿舍、球隊…">
      <label>敞開程度</label>
      <select name="openness"></select>
      <div class="grid2">
        <div><label>LINE ID</label><input name="lineId" placeholder="個人 ID 前面加 ~"></div>
        <div><label>IG 帳號</label><input name="igId" placeholder="不用加 @"></div>
      </div>
      <label>代禱事項（一行一項）</label><textarea name="prayer"></textarea>
      <div class="grid2">
        <div><label>讀經：書卷</label><input name="readBook" list="bookList" placeholder="約翰福音"></div>
        <div><label>讀經：第幾章</label><input name="readChapter" type="number" min="1" max="150"></div>
      </div>
      <label>下次約見時間</label><input name="apptAt" type="datetime-local">
      <div class="grid2">
        <div><label>地點</label><input name="apptPlace"></div>
        <div><label>要讀的經文</label><input name="apptPassage" placeholder="約翰福音 3:16"></div>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn danger" id="deleteBtn" style="margin-right:auto">刪除</button>
      <button type="button" class="btn" data-close>取消</button>
      <button type="submit" class="btn primary">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="logDlg">
  <form class="dlg" id="logForm" method="dialog">
    <div class="dlg-head"><h2>新增互動紀錄</h2><button type="button" class="x" data-close>✕</button></div>
    <div class="dlg-body">
      <label>日期</label><input name="date" type="date" required>
      <label>摘要 *</label><input name="summary" required placeholder="例如：IG 私訊聊天、一起吃午餐">
      <label>聊了什麼主題（用逗號分開）</label><input name="topics" placeholder="近況, 課業壓力, 禱告">
    </div>
